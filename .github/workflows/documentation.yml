name: Documentation

on:
  pull_request:
    branches: [staging, main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation / documentation
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.tools/puppeteer
      npm_config_cache: ${{ github.workspace }}/.tools/npm-cache
    steps:
      - name: Check out PR head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked documentation dependencies
        run: npm ci --no-fund --no-audit
      - name: Install local renderer browser
        run: node node_modules/puppeteer/install.mjs
      - name: Test positive and negative gate fixtures
        run: npm run docs:test
      - name: Validate PR documentation and metadata
        if: github.event_name == 'pull_request'
        run: python scripts/docs/check.py --event "$env:GITHUB_EVENT_PATH"
      - name: Validate merge queue content
        if: github.event_name == 'merge_group'
        run: python scripts/docs/check.py --content-only
